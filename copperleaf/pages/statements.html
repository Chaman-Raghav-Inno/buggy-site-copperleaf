<h1>Statements</h1>
<form id="st-form" class="filters card" novalidate>
  <div class="field"><label for="st-account">Account</label><select id="st-account"><option value="1">Everyday Account</option><option value="2">Rainy Day Saver</option><option value="3">Copper Card</option></select></div>
  <div class="field"><label for="st-month">Month</label><select id="st-month"></select></div>
</form>
<p id="loading" class="muted">Loading…</p>
<article id="statement" class="card" hidden>
  <div class="section-head"><h2 id="st-title"></h2><a id="st-csv" class="btn btn-ghost btn-small">Download CSV</a></div>
  <dl class="facts st-facts" id="st-facts"></dl>
  <div class="table-wrap">
    <table class="table txn-table" aria-label="Statement transactions">
      <thead><tr><th>Date</th><th>Description</th><th class="num">Amount</th></tr></thead>
      <tbody id="st-rows"></tbody>
    </table>
  </div>
</article>
